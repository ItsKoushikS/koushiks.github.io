.form-group input {

  background: #fafafa;
  border: 1px solid #dbdbdb;
  border-radius: 3px;
  font-size: 12px;
  color: #262626;
  outline: none;
}
.form-group input:focus { border-color: #a8a8a8; }
.form-group label {
  position: absolute;
  left: 8px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 12px;
  color: #8e8e8e;
  pointer-events: none;
  transition: 0.1s ease;
}
.form-group input:focus + label,
.form-group input:not(:placeholder-shown) + label {
  top: 4px;
  transform: translateY(0);
  font-size: 10px;
}
.btn-login {
  width: 100%;
  padding: 8px;
  background: #0095f6;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 12px;
  opacity: 0.7;
  pointer-events: none;
  transition: 0.2s;
}
.btn-login.active { opacity: 1; pointer-events: auto; }

.forgot-pw { color: #00376b; font-size: 12px; text-decoration: none; }
.signup-box {

  border-radius: 1px;
  padding: 20px 40px;
  width: 350px;
  text-align: center;
  margin-top: 10px;

footer {
